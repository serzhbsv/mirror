name: Download Hero Tale WebGL Files

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Download all files
        run: |
          mkdir -p Build StreamingAssets/aa/WebGL

          curl -L -o "Build/WebGLDemo.loader.js" \
            "https://html-classic.itch.zone/html/8819725/Build/WebGLDemo.loader.js"

          curl -L -o "Build/WebGLDemo.data.gz" \
            "https://html-classic.itch.zone/html/8819725/Build/WebGLDemo.data.gz"

          curl -L -o "Build/WebGLDemo.framework.js.gz" \
            "https://html-classic.itch.zone/html/8819725/Build/WebGLDemo.framework.js.gz"

          curl -L -o "Build/WebGLDemo.wasm.gz" \
            "https://html-classic.itch.zone/html/8819725/Build/WebGLDemo.wasm.gz"

          curl -L -o "StreamingAssets/aa/settings.json" \
            "https://html-classic.itch.zone/html/8819725/StreamingAssets/aa/settings.json"

          curl -L -o "StreamingAssets/aa/catalog.json" \
            "https://html-classic.itch.zone/html/8819725/StreamingAssets/aa/catalog.json"

          curl -L -o "StreamingAssets/UnityServicesProjectConfiguration.json" \
            "https://html-classic.itch.zone/html/8819725/StreamingAssets/UnityServicesProjectConfiguration.json"

          curl -L -o "StreamingAssets/aa/WebGL/defaultlocalgroup_assets_all_5c0c45729a0a605d2d1f55fd848a8432.bundle" \
            "https://html-classic.itch.zone/html/8819725/StreamingAssets/aa/WebGL/defaultlocalgroup_assets_all_5c0c45729a0a605d2d1f55fd848a8432.bundle"

      - name: List downloaded files
        run: |
          echo "=== Build ==="
          ls -lh Build/
          echo "=== StreamingAssets ==="
          find StreamingAssets/ -type f -exec ls -lh {} \;

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hero-tale-webgl
          path: |
            Build/
            StreamingAssets/
          retention-days: 30
