name: Download Hero Tale WebGL Files

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Create directories
        run: |
          mkdir -p Build StreamingAssets/aa/WebGL

      - name: Download files
        run: |
          BASE="https://html-classic.itch.zone/html/8819725"

          # Build files
          curl -L -o Build/WebGLDemo.loader.js "$BASE/Build/WebGLDemo.loader.js"
          curl -L -o Build/WebGLDemo.data.gz "$BASE/Build/WebGLDemo.data.gz"
          curl -L -o Build/WebGLDemo.framework.js.gz "$BASE/Build/WebGLDemo.framework.js.gz"
          curl -L -o Build/WebGLDemo.wasm.gz "$BASE/Build/WebGLDemo.wasm.gz"

          # StreamingAssets
          curl -L -o StreamingAssets/aa/settings.json "$BASE/StreamingAssets/aa/settings.json"
          curl -L -o StreamingAssets/aa/catalog.json "$BASE/StreamingAssets/aa/catalog.json"
          curl -L -o StreamingAssets/UnityServicesProjectConfiguration.json "$BASE/StreamingAssets/UnityServicesProjectConfiguration.json"

          # Asset bundle
          curl -L -o "StreamingAssets/aa/WebGL/defaultlocalgroup_assets_all_5c0c45729a0a605d2d1f55fd848a8432.bundle" \
            "$BASE/StreamingAssets/aa/WebGL/defaultlocalgroup_assets_all_5c0c45729a0a605d2d1f55fd848a8432.bundle"

      - name: Decompress .gz files
        run: |
          cd Build
          gunzip -k WebGLDemo.data.gz
          gunzip -k WebGLDemo.framework.js.gz
          gunzip -k WebGLDemo.wasm.gz

      - name: Show file sizes
        run: |
          echo "=== Downloaded files ==="
          find . -type f -exec ls -lh {} \;

      - name: Upload as artifact
        uses: actions/upload-artifact@v4
        with:
          name: hero-tale-webgl
          path: |
            Build/
            StreamingAssets/
          retention-days: 30
