name: Зеркало footbook.ru

on:
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    
    steps:
      - name: Авторизация и получение кук
        run: |
          # Шаг 1: Получаем куки с главной (игнорируем сертификат)
          curl -k -4 --connect-timeout 60 --max-time 300 \
               -L https://footbook.ru/index.php \
               -c cookies.txt -b cookies.txt -o /dev/null
          
          # Шаг 2: Отправляем форму логина
          curl -k -4 --connect-timeout 60 --max-time 300 \
               -X POST https://footbook.ru/login.php \
               -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
               -H "Content-Type: application/x-www-form-urlencoded" \
               -H "Referer: https://footbook.ru/login.php" \
               -d "login=${{ secrets.SITE_LOGIN }}" \
               -d "password=${{ secrets.SITE_PASSWORD }}" \
               -d "remember=on" \
               -b cookies.txt \
               -c cookies.txt \
               -L \
               -v 2>&1 | grep -E "cookie|HTTP|Location|PHPSESSID"
          
          # Показываем куки
          echo "=== Полученные куки ==="
          cat cookies.txt
      
      - name: Проверка авторизации
        run: |
          # Проверяем наличие сессии
          if grep -q "PHPSESSID" cookies.txt; then
            echo "✅ Сессия создана!"
          else
            echo "❌ Сессия НЕ создана!"
            exit 1
          fi
          
          # Пытаемся получить доступ к защищённой странице
          echo "=== Проверка доступа ==="
          curl -k -4 -L https://footbook.ru/index.php -b cookies.txt -s | grep -i "выйти\|logout" && echo "✅ ДОСТУП ПОЛУЧЕН" || echo "⚠️ Доступ не проверен"
      
      - name: Скачивание сайта с авторизацией
        run: |
          wget --inet4-only \
               --no-check-certificate \
               --timeout=60 \
               --tries=5 \
               --mirror \
               --page-requisites \
               --convert-links \
               --adjust-extension \
               --no-parent \
               --domains=footbook.ru \
               --load-cookies cookies.txt \
               --keep-session-cookies \
               --header="User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
               --header="Referer: https://footbook.ru/" \
               --wait=2 \
               --limit-rate=200k \
               https://footbook.ru
          
          # Проверяем результат
          echo "=== Размер скачанного сайта ==="
          du -sh ./footbook.ru 2>/dev/null || echo "⚠️ Папка не создана"
          echo "=== Количество файлов ==="
          find ./footbook.ru -type f 2>/dev/null | wc -l || echo "0"
          echo "=== Первые 10 файлов ==="
          find ./footbook.ru -type f 2>/dev/null | head -10
      
      - name: Архивация и разбивка
        run: |
          if [ -d "./footbook.ru" ] && [ "$(ls -A ./footbook.ru)" ]; then
            tar -czf footbook-mirror.tar.gz ./footbook.ru
            split -b 500M footbook-mirror.tar.gz "footbook-part-" -a 2
            echo "=== Созданные части ==="
            ls -lh footbook-part-*
            echo "Количество частей: $(ls footbook-part-* 2>/dev/null | wc -l)"
          else
            echo "⚠️ Папка пуста или не создана!"
            exit 1
          fi
      
      - name: Загрузка артефактов
        uses: actions/upload-artifact@v4
        with:
          name: footbook-mirror-parts
          path: footbook-part-*
          retention-days: 7
          if-no-files-found: error
