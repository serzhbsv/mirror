name: Сбор ссылок footbook.ru

on:
  workflow_dispatch:
    inputs:
      max_depth:
        description: 'Глубина обхода (1-5)'
        required: true
        default: '3'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '4'
          - '5'

jobs:
  collect-links:
    runs-on: ubuntu-latest
    
    steps:
      - name: Установка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Установка зависимостей
        run: npm install puppeteer fs-extra
    
      - name: Создание скрипта для сбора ссылок
        run: |
          cat > collect.js << 'EOF'
          const puppeteer = require('puppeteer');
          const fs = require('fs-extra');
          const path = require('path');

          const BASE_URL = 'https://footbook.ru';
          const OUTPUT_DIR = './collected_links';
          const MAX_DEPTH = parseInt(process.env.MAX_DEPTH) || 3;

          const visited = new Set();
          const allLinks = new Set();
          const queue = [];

          console.log(`📊 Максимальная глубина: ${MAX_DEPTH}`);

          // Авторизация (исправленная)
          async function login(page) {
            console.log('🔄 Авторизация...');
            
            try {
              // Переход на главную страницу
              await page.goto(BASE_URL, { 
                waitUntil: 'networkidle2', 
                timeout: 60000 
              });
              
              // Ждём появления формы входа
              await page.waitForSelector('input[name="login"]', { timeout: 10000 });
              await page.waitForSelector('input[name="password"]', { timeout: 10000 });
              
              // Вводим логин
              await page.type('input[name="login"]', process.env.SITE_LOGIN, { delay: 50 });
              console.log('✅ Логин введён');
              
              // Вводим пароль
              await page.type('input[name="password"]', process.env.SITE_PASSWORD, { delay: 50 });
              console.log('✅ Пароль введён');
              
              // Нажимаем на кнопку через evaluate (более надёжно)
              await page.evaluate(() => {
                const submitButton = document.querySelector('input[type="submit"]');
                if (submitButton) {
                  submitButton.click();
                  return true;
                }
                return false;
              });
              
              console.log('✅ Кнопка отправки нажата');
              
              // Ждём перехода после логина
              await page.waitForNavigation({ 
                waitUntil: 'networkidle2', 
                timeout: 60000 
              });
              
              // Проверяем, что авторизация прошла успешно
              const currentUrl = page.url();
              console.log(`📍 Текущий URL после логина: ${currentUrl}`);
              
              if (currentUrl.includes('login.php')) {
                console.log('⚠️ Возможно, авторизация не прошла. Проверьте логин/пароль.');
                // Проверяем наличие ошибки
                const errorText = await page.evaluate(() => {
                  const error = document.querySelector('.error, .alert, .message');
                  return error ? error.textContent : null;
                });
                if (errorText) {
                  console.log(`❌ Ошибка авторизации: ${errorText}`);
                  throw new Error('Ошибка авторизации');
                }
              } else {
                console.log('✅ Авторизация успешна!');
              }
              
              // Сохраняем куки для использования в wget
              const cookies = await page.cookies();
              const cookieString = cookies.map(c => `${c.name}=${c.value}`).join('; ');
              await fs.writeFile('cookies.txt', cookieString);
              console.log('✅ Куки сохранены');
              
            } catch (error) {
              console.error('❌ Ошибка при авторизации:', error.message);
              throw error;
            }
          }

          // Сбор ссылок с одной страницы
          async function collectLinksFromPage(page, url, depth) {
            try {
              console.log(`🔍 [Глубина ${depth}] Сбор ссылок с: ${url}`);
              
              await page.goto(url, { 
                waitUntil: 'networkidle2', 
                timeout: 30000 
              });
              
              // Ждём загрузки динамического контента
              try {
                await page.waitForSelector('#tree', { timeout: 5000 });
                await page.waitForFunction(
                  () => document.querySelector('#tree .jstree-node') !== null,
                  { timeout: 10000 }
                );
              } catch (e) {
                console.log('⏳ Дерево не найдено или уже загружено');
              }
              
              // Собираем ссылки
              const links = await page.evaluate(() => {
                const result = new Set();
                const excludeWords = ['logout', 'exit', 'signout'];
                
                // Обычные ссылки
                document.querySelectorAll('a[href]').forEach(a => {
                  let href = a.getAttribute('href');
                  if (href && !href.startsWith('#') && !href.startsWith('javascript:')) {
                    if (href.startsWith('/')) {
                      href = window.location.origin + href;
                    }
                    // Проверяем на исключения
                    const shouldExclude = excludeWords.some(word => href.toLowerCase().includes(word));
                    if (!shouldExclude) {
                      result.add(href);
                    }
                  }
                });
                
                // Ссылки из дерева (jstree)
                document.querySelectorAll('.jstree-node').forEach(node => {
                  const id = node.getAttribute('id');
                  if (id && id !== '#') {
                    const link = `${window.location.origin}/index.php?type=1&lid=${id}`;
                    result.add(link);
                  }
                });
                
                return Array.from(result);
              });
              
              // Собираем города через AJAX
              try {
                const cities = await page.evaluate(() => {
                  return new Promise((resolve) => {
                    if (typeof $ !== 'undefined') {
                      $.ajax({
                        url: 'getplace.php',
                        data: { par: 'all' },
                        type: 'POST',
                        cache: false,
                        success: (data) => resolve(data),
                        error: () => resolve([])
                      });
                    } else {
                      resolve([]);
                    }
                  });
                }).catch(() => []);
                
                if (Array.isArray(cities) && cities.length > 0) {
                  cities.forEach(city => {
                    if (city.id) {
                      allLinks.add(`${BASE_URL}/index.php?type=2&pid=${city.id}`);
                    }
                  });
                  console.log(`🏙️ Добавлено городов: ${cities.length}`);
                }
              } catch (e) {
                console.log('⏳ Города не загружены');
              }
              
              // Добавляем ссылки в общий список
              const filteredLinks = links.filter(link => {
                const excludeWords = ['logout', 'exit', 'signout'];
                const shouldExclude = excludeWords.some(word => link.toLowerCase().includes(word));
                return link.startsWith(BASE_URL) && !shouldExclude;
              });
              
              filteredLinks.forEach(link => allLinks.add(link));
              
              console.log(`📊 Найдено ссылок на странице: ${filteredLinks.length}`);
              
              return filteredLinks;
              
            } catch (error) {
              console.error(`❌ Ошибка на ${url}:`, error.message);
              return [];
            }
          }

          // Основная функция
          async function main() {
            console.log('🚀 Запуск сбора ссылок...');
            console.log(`📊 Глубина обхода: ${MAX_DEPTH}`);
            
            const browser = await puppeteer.launch({
              headless: 'new',
              args: [
                '--no-sandbox', 
                '--disable-setuid-sandbox',
                '--disable-dev-shm-usage',
                '--disable-accelerated-2d-canvas',
                '--disable-gpu'
              ]
            });
            
            const page = await browser.newPage();
            await page.setDefaultNavigationTimeout(60000);
            await page.setUserAgent('Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36');
            await page.setViewport({ width: 1280, height: 800 });
            
            // Авторизация
            await login(page);
            
            // Добавляем главную страницу в очередь
            queue.push({ url: BASE_URL, depth: 0 });
            
            // Обход страниц
            let processed = 0;
            const maxPages = 300; // Ограничение для безопасности
            
            while (queue.length > 0 && processed < maxPages) {
              const { url, depth } = queue.shift();
              
              // Пропускаем если уже посетили
              if (visited.has(url)) continue;
              visited.add(url);
              
              // Если достигли максимальной глубины - не добавляем новые ссылки
              const nextDepth = depth + 1;
              const shouldCollectDeeper = nextDepth <= MAX_DEPTH;
              
              // Собираем ссылки
              const newLinks = await collectLinksFromPage(page, url, depth);
              
              // Добавляем новые ссылки в очередь
              if (shouldCollectDeeper) {
                let addedCount = 0;
                for (const link of newLinks) {
                  if (!visited.has(link) && !queue.some(item => item.url === link)) {
                    queue.push({ url: link, depth: nextDepth });
                    addedCount++;
                  }
                }
                console.log(`📌 Добавлено в очередь: ${addedCount} ссылок (глубина ${nextDepth})`);
              }
              
              processed++;
              console.log(`⏳ Обработано страниц: ${processed}, Осталось в очереди: ${queue.length}`);
              
              // Задержка между запросами
              await new Promise(resolve => setTimeout(resolve, 1000));
            }
            
            console.log(`✅ Сбор завершён!`);
            console.log(`📊 Всего уникальных ссылок: ${allLinks.size}`);
            
            // Сохраняем результаты
            await fs.ensureDir(OUTPUT_DIR);
            
            const linksArray = Array.from(allLinks).sort();
            
            // Основной файл со ссылками
            await fs.writeFile(
              path.join(OUTPUT_DIR, 'all_links.txt'),
              linksArray.join('\n')
            );
            
            // Файл со статистикой
            const stats = {
              total: linksArray.length,
              depth: MAX_DEPTH,
              processed_pages: processed,
              timestamp: new Date().toISOString(),
              domain: BASE_URL
            };
            
            await fs.writeFile(
              path.join(OUTPUT_DIR, 'stats.json'),
              JSON.stringify(stats, null, 2)
            );
            
            // Группировка по типу
            const linksByType = {
              main: linksArray.filter(l => l.includes('index.php')),
              regions: linksArray.filter(l => l.includes('type=1')),
              cities: linksArray.filter(l => l.includes('type=2')),
              matches: linksArray.filter(l => l.includes('type=3')),
              other: linksArray.filter(l => !l.includes('type='))
            };
            
            for (const [type, urls] of Object.entries(linksByType)) {
              if (urls.length > 0) {
                await fs.writeFile(
                  path.join(OUTPUT_DIR, `links_${type}.txt`),
                  urls.join('\n')
                );
              }
            }
            
            console.log(`\n📊 Статистика:`);
            console.log(`  - Всего ссылок: ${linksArray.length}`);
            console.log(`  - Страницы: ${stats.processed_pages}`);
            console.log(`  - Глубина: ${stats.depth}`);
            console.log(`  - Основные: ${linksByType.main.length}`);
            console.log(`  - Регионы: ${linksByType.regions.length}`);
            console.log(`  - Города: ${linksByType.cities.length}`);
            console.log(`  - Матчи: ${linksByType.matches.length}`);
            
            await browser.close();
            console.log(`\n✅ Файлы сохранены в: ${OUTPUT_DIR}/`);
          }

          main().catch(console.error);
          EOF
      
      - name: Запуск сбора ссылок
        run: node collect.js
        env:
          SITE_LOGIN: ${{ secrets.SITE_LOGIN }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          MAX_DEPTH: ${{ github.event.inputs.max_depth }}
      
      - name: Проверка результатов
        run: |
          echo "=== Статистика ==="
          cat ./collected_links/stats.json
          echo ""
          echo "=== Первые 20 ссылок ==="
          head -20 ./collected_links/all_links.txt
          echo ""
          echo "=== Количество ссылок по типам ==="
          wc -l ./collected_links/links_*.txt
      
      - name: Загрузка результатов
        uses: actions/upload-artifact@v4
        with:
          name: collected-links-depth-${{ github.event.inputs.max_depth }}
          path: |
            ./collected_links/*.txt
            ./collected_links/*.json
          retention-days: 7
