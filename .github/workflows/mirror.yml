name: Зеркало footbook.ru

on:
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    
    steps:
      - name: Авторизация и получение кук (улучшенная)
        run: |
          # Шаг 1: Получаем куки с главной
          curl -4 --connect-timeout 60 --max-time 300 \
               -L http://footbook.ru/index.php \
               -c cookies.txt -b cookies.txt -o /dev/null
          
          # Шаг 2: Отправляем форму логина
          # Важно: сохраняем куки ДО и ПОСЛЕ отправки
          curl -4 --connect-timeout 60 --max-time 300 \
               -X POST http://footbook.ru/login.php \
               -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
               -H "Content-Type: application/x-www-form-urlencoded" \
               -H "Referer: http://footbook.ru/login.php" \
               -d "login=${{ secrets.SITE_LOGIN }}" \
               -d "password=${{ secrets.SITE_PASSWORD }}" \
               -d "remember=on" \
               -b cookies.txt \
               -c cookies.txt \  # Сохраняем куки ПОСЛЕ отправки формы
               -L \
               -v  # Добавляем verbose режим для отладки
          
          # Показываем финальные куки
          echo "=== Финальные куки ==="
          cat cookies.txt
          
          # Проверяем, что куки обновились
          if grep -q "PHPSESSID" cookies.txt; then
            echo "✅ Сессия создана!"
          else
            echo "❌ Сессия не создана!"
          fi
      
      - name: Проверка авторизации (на странице профиля)
        run: |
          # Пытаемся зайти на страницу, которая точно требует авторизации
          # Обычно это /profile.php, /account.php, /cabinet.php
          echo "=== Проверка доступа к защищённым страницам ==="
          
          # Пробуем разные возможные URL
          for url in "profile.php" "account.php" "cabinet.php" "user.php" "lk.php"; do
            echo "--- Проверка http://footbook.ru/$url ---"
            RESPONSE=$(curl -4 -L http://footbook.ru/$url -b cookies.txt -s)
            
            if echo "$RESPONSE" | grep -qi "выйти\|logout\|личный кабинет\|мои данные\|привет"; then
              echo "✅ ДОСТУП ПОЛУЧЕН на $url"
              echo "$RESPONSE" | head -50
              break
            else
              echo "❌ Нет доступа к $url"
            fi
          done
      
      - name: Скачивание сайта с авторизацией
        run: |
          wget --inet4-only \
               --timeout=60 \
               --tries=5 \
               --mirror \
               --page-requisites \
               --convert-links \
               --adjust-extension \
               --no-parent \
               --domains=footbook.ru \
               --load-cookies cookies.txt \
               --keep-session-cookies \  # Важно! Сохраняет сессионные куки
               --header="User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
               --header="Referer: http://footbook.ru/" \
               --wait=2 \
               --limit-rate=200k \
               http://footbook.ru
      
      - name: Архивация и разбивка
        run: |
          tar -czf footbook-mirror.tar.gz ./footbook.ru
          split -b 500M footbook-mirror.tar.gz "footbook-part-" -a 2
          ls -lh footbook-part-*
      
      - name: Загрузка артефактов
        uses: actions/upload-artifact@v4
        with:
          name: footbook-mirror-parts
          path: footbook-part-*
          retention-days: 7
