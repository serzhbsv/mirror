- name: Авторизация и получение кук
  run: |
    # Используем HTTP
    curl -L http://footbook.ru/index.php -c cookies.txt -b cookies.txt -o /dev/null
    
    curl -X POST http://footbook.ru/login.php \
         -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
         -H "Content-Type: application/x-www-form-urlencoded" \
         -d "login=${{ secrets.SITE_LOGIN }}" \
         -d "password=${{ secrets.SITE_PASSWORD }}" \
         -d "remember=on" \
         -b cookies.txt \
         -c cookies.txt \
         -L \
         -o /dev/null

- name: Скачивание сайта с авторизацией
  run: |
    wget --mirror \
         --page-requisites \
         --convert-links \
         --adjust-extension \
         --no-parent \
         --domains=footbook.ru \
         --load-cookies cookies.txt \
         --header="User-Agent: Mozilla/5.0" \
         --wait=2 \
         --limit-rate=200k \
         http://footbook.ru  # <-- Здесь тоже меняем на http
